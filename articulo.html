<!DOCTYPE html>

<body>

<header class="sbe-header">
  <div class="sbe-shell sbe-header-inner">
    <a class="sbe-brand" href="index.html">
      <img class="sbe-brand-banner" src="assets/vision-zero-banner.png" alt="Visión Zero — Soluciones conductuales para la Seguridad y Salud en el trabajo" />
    </a>

    <div class="sbe-actions" id="sbe-actions-logged-out">
      <button class="sbe-btn" data-open-auth="login">Iniciar sesión</button>
      <button class="sbe-btn sbe-btn-solid" data-open-auth="register">Regístrate aquí</button>
    </div>

    <div class="sbe-actions sbe-user-chip sbe-hidden" id="sbe-actions-logged-in">
      <span id="sbe-user-label"></span>
      <a class="sbe-admin-link sbe-hidden" id="sbe-admin-link" href="admin.html">Panel admin</a>
      <button class="sbe-btn-plain" id="sbe-logout-btn">Cerrar sesión</button>
    </div>
  </div>
</header>

<main>
  <div class="sbe-shell sbe-article-shell">
    <a class="sbe-btn-plain sbe-article-back" href="index.html">← Volver al catálogo</a>
    <div id="sbe-article-content">
      <p>Cargando…</p>
    </div>
  </div>
</main>

      <span class="sbe-footer-contact-label">Contáctanos</span>
      <div class="sbe-social-icons">
        <a class="sbe-social-icon" href="#" aria-label="WhatsApp" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20l1.3-4A8 8 0 1 1 9 19l-5 1z" />
            <path d="M9 10.5c0 2.5 2 4.5 4.5 4.5.4 0 .8-.6.6-1l-.8-1.6c-.1-.3-.5-.4-.8-.2l-.6.4a4 4 0 0 1-2-2l.4-.6c.2-.3.1-.7-.2-.8L8.5 8c-.4-.2-1 .2-1 .6.1.7.3 1.3.5 1.9z" />
          </svg>
        </a>
        <a class="sbe-social-icon" href="#" aria-label="LinkedIn" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="3" />
            <line x1="8" y1="10.5" x2="8" y2="16" />
            <circle cx="8" cy="7.3" r="0.4" fill="currentColor" stroke="none" />
            <path d="M12 16v-3.2c0-1.5 1-2.3 2-2.3s2 .6 2 2.2V16" />
          </svg>
        </a>
        <a class="sbe-social-icon" href="#" aria-label="YouTube" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="6.5" width="17" height="11" rx="3" />
            <path d="M11 10l4 2-4 2z" fill="currentColor" stroke="none" />
          </svg>
        </a>
        <a class="sbe-social-icon" href="#" aria-label="Instagram" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="4.5" />
            <circle cx="12" cy="12" r="3.4" />
            <circle cx="16.2" cy="7.8" r="0.4" fill="currentColor" stroke="none" />

    </div>

</footer>

<!-- ---------- Modal de registro / inicio de sesión ---------- -->
<div class="sbe-modal-backdrop" id="sbe-auth-modal">
  <div class="sbe-modal">
    <button class="sbe-modal-close" data-close-modal aria-label="Cerrar">✕</button>

    <div id="sbe-login-screen">
      <h2 class="sbe-modal-title">Iniciar sesión</h2>
      <form class="sbe-form" id="sbe-login-form">
        <label>Correo electrónico
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>Contraseña
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <button class="sbe-btn sbe-btn-solid" type="submit">Iniciar sesión</button>
      </form>
      <div class="sbe-divider">o continúa con</div>
      <div class="sbe-google-btn"></div>
      <p class="sbe-switch-line">
        ¿No tienes cuenta?
        <button type="button" class="sbe-switch-link" data-auth-tab="register">Regístrate aquí</button>
      </p>
    </div>

    <div id="sbe-register-screen" class="sbe-hidden">
      <h2 class="sbe-modal-title">Crear cuenta</h2>
      <form class="sbe-form" id="sbe-register-form">
        <label>Nombre
          <input type="text" name="nombre" required autocomplete="name" />
        </label>
        <label>Correo electrónico
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>Contraseña
          <input type="password" name="password" required minlength="8" autocomplete="new-password" />
        </label>
        <label>Confirmar contraseña
          <input type="password" name="passwordConfirm" required minlength="8" autocomplete="new-password" />
        </label>
        <button class="sbe-btn sbe-btn-solid" type="submit">Crear cuenta</button>
      </form>
      <div class="sbe-divider">o regístrate con</div>
      <div class="sbe-google-btn"></div>
      <p class="sbe-switch-line">
        ¿Ya tienes cuenta?
        <button type="button" class="sbe-switch-link" data-auth-tab="login">Inicia sesión</button>
      </p>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/config.js"></script>
<script src="js/crypto-utils.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/content-data.js"></script>
<script src="js/content-access.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth-ui.js"></script>
<script src="js/google-auth.js"></script>
<script src="js/header-ui.js"></script>
<script src="js/articulo.js"></script>
</body>
</html>
